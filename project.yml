name: NTFSForMac
options:
  bundleIdPrefix: com.docuong
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  NTFSCore:
    path: Core
targets:
  NTFSForMac:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - target: NTFSExtension
        embed: true
        codeSign: true
      - package: NTFSCore
        product: NTFSShared
      - package: NTFSCore
        product: NTFSFormat
    postBuildScripts:
      - name: Embed format helpers
        script: '"$SRCROOT/scripts/embed-helpers.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: NTFS for Mac
        PRODUCT_BUNDLE_IDENTIFIER: com.docuong.ntfsformac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NTFSForMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  NTFSExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extension
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - sdk: FSKit.framework
    settings:
      base:
        PRODUCT_NAME: NTFSExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.docuong.ntfsformac.fsmodule
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/NTFSExtension.entitlements
        SKIP_INSTALL: YES
  NTFSForMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: NTFSForMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docuong.ntfsformac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NTFS for Mac.app/Contents/MacOS/NTFS for Mac"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NTFSForMac:
    build:
      targets:
        NTFSForMac: all
        NTFSExtension: all
    test:
      language: en
      region: US
      targets:
        - NTFSForMacTests
